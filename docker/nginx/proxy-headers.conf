# Cabeceras del proxy hacia la API.
#
# `X-Request-ID` se propaga si viene del cliente; si no, Nginx genera uno para
# que la traza exista incluso en peticiones que la API no llega a ver.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id_if_empty;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
