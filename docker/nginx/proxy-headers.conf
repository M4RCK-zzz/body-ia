# Cabeceras del proxy hacia la API.
#
# `X-Request-ID` se propaga si viene del cliente; si no, Nginx genera uno para
# que la traza exista incluso en peticiones que la API no llega a ver.
#
# `X-Real-IP` y `X-Forwarded-For` se **sobrescriben** con `$remote_addr` (la IP
# real de la conexión TCP en el borde). No se usa `$proxy_add_x_forwarded_for`:
# esa variante conserva el salto que manda el cliente, y rotar ese valor
# evadiría el rate limiting por IP. La API solo lee `X-Real-IP`, y solo cuando
# `TRUSTED_PROXIES=true`.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id_if_empty;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
