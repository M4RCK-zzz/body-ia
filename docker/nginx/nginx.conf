# Nginx del borde (Fase 9).
#
# Sirve la SPA y hace de proxy inverso de `/api` **bajo el mismo origen**: así el
# navegador nunca cruza orígenes, `connect-src 'self'` es viable en la CSP y no
# hace falta exponer CORS a Internet.
#
# TLS: los certificados se leen de /etc/nginx/certs (fullchain.pem + privkey.pem),
# que en docker-compose.prod.yml es el bind mount ./docker/nginx/certs (ignorado
# por git: contiene claves privadas).
#   - Let's Encrypt: enlaza/copia /etc/letsencrypt/live/$DOMAIN/ en esa carpeta.
#   - Pruebas locales: scripts/tls-selfsigned.ps1 | scripts/tls-selfsigned.sh
#     (o ALLOW_SELFSIGNED=true, que los genera al arrancar).

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Log con `request_id` para cruzar Nginx ↔ API ↔ auditoría.
    log_format json_combined escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id","host":"$host"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;   # alineado con MAX_UPLOAD_MB=10 (+ margen)

    # Compresión de texto; nunca de binarios ya comprimidos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # `X-Request-ID` del cliente o uno generado por Nginx ($request_id es único
    # por petición); se usa en el proxy para que la traza nunca quede vacía.
    map $http_x_request_id $request_id_if_empty {
        default $http_x_request_id;
        ""      $request_id;
    }

    # --- rate limiting en el borde (segunda barrera, ver D5) ----------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # TLS moderno: sin TLSv1.0/1.1, sin RC4/3DES.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
