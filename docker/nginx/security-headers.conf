# Cabeceras de seguridad del borde (Fase 9, §3.3).
#
# La CSP es la misma que sirve la API (`app/core/security_headers.py`) para que
# el navegador no reciba dos políticas distintas según el recurso:
#
#   script-src 'self' 'wasm-unsafe-eval'   -> decodificador Draco WASM (/draco/)
#   worker-src 'self' blob:                -> workers del visor 3D
#   img-src 'self' blob: data:             -> miniaturas de captura (blob) y data:
#   style-src 'self' 'unsafe-inline'       -> estilos inline de React/R3F
#
# Nunca `unsafe-eval` ni `unsafe-inline` en script-src.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS solo cuando el despliegue es HTTPS de verdad. `always` para que también
# viaje en las respuestas de error.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
