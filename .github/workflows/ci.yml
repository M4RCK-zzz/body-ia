# CI de BODYVISION AI (Fase 9, decisión D15).
#
# Dos jobs independientes y **sin despliegue automático**: el despliegue es
# manual y está en docs/runbooks/deploy.md.
#
#   backend  -> ruff (0 avisos) + alembic upgrade/downgrade real + pytest
#   frontend -> npm ci + eslint + tsc + build
#
# El job de backend levanta PostgreSQL 16 como servicio: las migraciones se
# prueban de verdad (ida, vuelta y `alembic check`), no contra un mock.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (ruff + migraciones + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: bodyvision
          POSTGRES_USER: bodyvision
          POSTGRES_PASSWORD: ci-password-0123456789
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bodyvision -d bodyvision"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://bodyvision:ci-password-0123456789@localhost:5432/bodyvision
      JWT_SECRET: ci-secret-only-for-github-actions-0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (0 avisos)
        run: ruff check .

      - name: Migraciones (ida, vuelta y coherencia)
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build de producción
        run: npm run build
        env:
          # Producción: URLs relativas (mismo origen detrás de Nginx). Ver D9.
          VITE_API_URL: ""

  compose:
    name: Composición de producción
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias (PyYAML incluido en requirements-dev)
        run: pip install -r backend/requirements-dev.txt

      - name: Validar docker-compose + Nginx + Dockerfiles
        run: |
          cp .env.prod.example .env.prod
          python - <<'PY'
          import re, pathlib
          # Secretos falsos pero con forma válida, para que el validador no falle.
          path = pathlib.Path(".env.prod")
          text = path.read_text()
          text = re.sub(r"^POSTGRES_PASSWORD=.*$", "POSTGRES_PASSWORD=" + "a" * 40, text, flags=re.M)
          text = re.sub(r"^JWT_SECRET=.*$", "JWT_SECRET=" + "b" * 48, text, flags=re.M)
          path.write_text(text)
          PY
          python backend/scripts/validate_compose.py --env .env.prod

      # `config` valida además la sintaxis de Compose (y de sus variables). El
      # `--env-file` es obligatorio: sin él Compose interpola desde `.env` (raíz),
      # que no existe en el repo, y `${POSTGRES_PASSWORD:?...}` aborta.
      - name: Validar sintaxis de Compose (docker compose config)
        run: |
          docker compose --env-file .env.prod \
            -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
          docker compose --env-file .env.prod \
            -f docker-compose.yml -f docker-compose.prod.yml config --services
